name: CERE Training Phase 2D - Reconciliation

on:
  workflow_dispatch:

jobs:
  phase2d:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run Phase 2D
        run: |
          python construir_cere_training_phase2d.py

      - name: Upload Phase 2D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase2d-reconciliation
          path: cere_phase2d_reconciliation/
