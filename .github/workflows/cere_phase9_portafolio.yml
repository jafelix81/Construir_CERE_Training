name: CERE Phase 9 - Simulador Real $1,000

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Run Phase 9
        run: |
          python construir_cere_phase9_portafolio.py

      - name: Upload Phase 9 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere_phase9_portfolio
          path: cere_phase9_portfolio/
          if-no-files-found: error
