name: CERE Fase 5C — Validación temporal ampliada

on:
  workflow_dispatch:

jobs:
  phase5c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance
      - name: Run CERE Phase 5C
        run: python construir_cere_training_phase5c.py
      - name: Upload Phase 5C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase5c-validation
          path: cere_phase5c_validation/
          if-no-files-found: error
