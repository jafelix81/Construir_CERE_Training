name: CERE Phase 8C - Stress Test Anti-Overfitting

on:
  workflow_dispatch:

jobs:
  phase8c:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run CERE Phase 8C
        run: |
          python construir_cere_training_phase8c.py

      - name: Upload Phase 8C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase8c-stress
          path: cere_phase8c_stress/
