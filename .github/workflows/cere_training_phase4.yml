name: CERE FASE 4 - WALK FORWARD OOS

on:
  workflow_dispatch:

jobs:
  phase4-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run CERE Phase 4
        run: |
          python construir_cere_training_phase4.py

      - name: Upload Phase 4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase4-walkforward
          path: cere_phase4_walkforward/
          if-no-files-found: error
