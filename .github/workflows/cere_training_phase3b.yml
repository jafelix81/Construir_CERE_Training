name: CERE Fase 3B - Robustez EV

on:
  workflow_dispatch:

jobs:
  phase3b:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run CERE Phase 3B
        run: |
          python construir_cere_training_phase3b.py

      - name: Upload Phase 3B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase3b-robustness
          path: cere_phase3b_robustness/
          if-no-files-found: error
