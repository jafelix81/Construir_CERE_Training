name: CERE Phase 3A - Conditional Engine

on:
  workflow_dispatch:

jobs:
  phase3a:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run Phase 3A
        run: |
          python construir_cere_training_phase3a.py

      - name: Upload Phase 3A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase3a-engine
          path: cere_phase3a_engine/
