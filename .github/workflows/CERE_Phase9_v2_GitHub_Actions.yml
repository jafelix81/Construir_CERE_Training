name: CERE Phase 9 v2 - Simulador Real $1,000

on:
  workflow_dispatch:

jobs:
  phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Run CERE Phase 9 v2
        env:
          CERE_UNIVERSE_FILE: ""
        run: |
          python construir_cere_phase9_v2_portafolio.py

      - name: Upload Phase 9 v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cere_phase9_v2_portfolio
          path: cere_phase9_v2_portfolio/
          if-no-files-found: warn
