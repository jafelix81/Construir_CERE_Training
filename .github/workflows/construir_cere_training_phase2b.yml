name: CERE Training — Fase 2B — Compact Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2b:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: CERE Training Phase 2B
        run: python construir_cere_training_phase2b.py

      - name: Upload Phase 2B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cere-training-phase2b
          path: cere_training_phase2b/
          if-no-files-found: warn
          retention-days: 14
