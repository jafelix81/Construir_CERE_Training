name: CERE FASE 5A - CROSS-SECTIONAL WALK-FORWARD OOS

on:
  workflow_dispatch:

jobs:
  phase5a-cross-sectional:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run CERE Phase 5A
        run: |
          python construir_cere_training_phase5a.py

      - name: Upload Phase 5A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase5a-cross-sectional
          path: cere_phase5a_cross_sectional/
          if-no-files-found: error
