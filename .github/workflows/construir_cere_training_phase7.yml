name: CERE — FASE 7 — ROBUSTEZ FINAL

on:
  workflow_dispatch:

jobs:
  phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run CERE Phase 7
        run: |
          python construir_cere_training_phase7.py

      - name: Upload Phase 7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cere-phase7-robustness
          path: cere_phase7_robustness/
          if-no-files-found: error
